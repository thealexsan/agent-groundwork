name: security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go vulnerabilities
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        if: hashFiles('**/go.mod') != ''
        with:
          go-version: stable
          cache: false

      - name: govulncheck, every module
        if: hashFiles('**/go.mod') != ''
        run: |
          for module in $(git ls-files '*go.mod' ':!:**/testdata/**'); do
            echo "== $(dirname "$module")"
            (cd "$(dirname "$module")" && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...)
          done

  dependencies:
    name: Dependencies, config and secrets in files
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: trivy
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.75.0 \
            fs --quiet --exit-code 1 --scanners vuln,misconfig,secret --severity HIGH,CRITICAL \
            --ignorefile /repo/.trivyignore.yaml /repo

  history:
    name: Secrets in git history
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
