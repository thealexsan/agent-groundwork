server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript
        application/xml image/svg+xml font/woff2;

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/{{SLUG}}-timing.log {{SNAKE}}_timing;
    include snippets/{{SLUG}}-edge.conf;

    client_max_body_size 25m;

    location /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include snippets/{{SLUG}}-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/{{SLUG}}-proxy.conf;
    }
}
