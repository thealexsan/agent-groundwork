log_format {{SNAKE}}_timing '$time_iso8601 $status $request_method $uri rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time uht=$upstream_header_time up=$upstream_addr ust=$upstream_status bytes=$body_bytes_sent proto=$server_protocol conn=$connection reqs=$connection_requests cf=$http_cf_ray ua="$http_user_agent"';
